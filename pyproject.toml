[project]
name = "india-stock-mcp"
version = "0.1.0"
description = "Production-ready MCP server for Indian stock market (NSE/BSE) analysis over Streamable HTTP."
readme = "README.md"
authors = [
    { name = "DiwakarReddy", email = "divakarreddyvengalreddy1107@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cachetools>=7.2.2",
    "mcp[cli]>=2.3,<3",
    "pandas>=3.0.6",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
